[package]
name = "d2d-types"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
windows-core = { version = "=0.62.2", default-features = false }
windows-numerics = { version = "=0.3.1", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", default-features = false, features = [
    "Win32_Foundation", "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct2D", "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging_D2D", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11", "Win32_Security",
    "Win32_Storage_Xps", "Win32_System_Ole", "Win32_System_Variant",
] }
