# OpenD2D ships to browsers (wasm): the std f32/f64 transcendentals go to the platform libm
# (glibc natively, Rust's libm on wasm, mingw on Windows), which disagree in the last ULP with each
# other and with the MSVC CRT native d2d1 links — a cross-platform difference is a user-fingerprinting
# bug. Route every transcendental through `crate::crt` (bit-exact ucrtbase ports) instead. `powi`
# (integer power = repeated multiply), `recip`, `sqrt` (IEEE correctly-rounded) and `to_radians`/
# `to_degrees` (a single constant multiply) are algebraic and bit-identical on every target, so they
# are allowed. `crate::crt` and the `#[allow]`-tagged oracle tests are exempt.
#
# Run: `cargo clippy -p d2d` (or with CLIPPY_CONF_DIR=crates/d2d).
disallowed-methods = [
    { path = "f32::sin", reason = "non-deterministic libm; use crate::crt::sinf" },
    { path = "f32::cos", reason = "non-deterministic libm; use crate::crt::cosf" },
    { path = "f32::sin_cos", reason = "non-deterministic libm; use crate::crt::sinf/cosf" },
    { path = "f32::tan", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::asin", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::acos", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::atan", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::atan2", reason = "non-deterministic libm; use crate::crt::atan2f" },
    { path = "f32::exp", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::exp2", reason = "non-deterministic libm; port into crate::crt (or exact bit math)" },
    { path = "f32::exp_m1", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::ln", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::ln_1p", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::log", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::log2", reason = "non-deterministic libm; port into crate::crt (or exact bit math)" },
    { path = "f32::log10", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::powf", reason = "non-deterministic libm; use crate::crt::powf" },
    { path = "f32::cbrt", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::hypot", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::sinh", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::cosh", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f32::tanh", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::sin", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::cos", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::sin_cos", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::tan", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::asin", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::acos", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::atan", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::atan2", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::exp", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::exp2", reason = "non-deterministic libm; port into crate::crt (or exact bit math)" },
    { path = "f64::exp_m1", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::ln", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::ln_1p", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::log", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::log2", reason = "non-deterministic libm; port into crate::crt (or exact bit math)" },
    { path = "f64::log10", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::powf", reason = "non-deterministic libm; use crate::crt::pow" },
    { path = "f64::cbrt", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::hypot", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::sinh", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::cosh", reason = "non-deterministic libm; port into crate::crt" },
    { path = "f64::tanh", reason = "non-deterministic libm; port into crate::crt" },
]
