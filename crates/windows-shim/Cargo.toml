[package]
name = "windows-shim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Consumed under the name `windows` (Cargo `package=` rename) so it is the single canonical source
# on every target: on Windows it just re-exports the real `windows` crate (which is `#![cfg(windows)]`);
# off Windows it provides windows-bindgen output over `windows-core` (see README.md to regenerate).
# Not a workspace `members` entry; it is an implicit member (a path dependency of the ffi crates).
[lib]
name = "windows_shim"
path = "src/lib.rs"

# Windows: the real crate, with the union of the features the three ffi crates need.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_DirectWrite",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Storage_Xps",
  "Win32_Storage_Xps_Printing",
  "Win32_Storage_Packaging_Opc",
  "Win32_UI_WindowsAndMessaging",
  "Foundation_Numerics",
]

# Off Windows: the generated bindings reference `windows_core::*`, which resolves to the superset
# shim so the gated pointer-string types and `Free` resolve.
[target.'cfg(not(windows))'.dependencies]
windows_core = { package = "windows-core-shim", path = "../windows-core-shim" }
windows-link = "0.2.1"
windows-numerics = "=0.3.1"
