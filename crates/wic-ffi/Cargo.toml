[package]
name = "wic-ffi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
# `windowscodecs` so the shared library is `windowscodecs.dll` (Windows): a true drop-in replacement.
# `rlib` too so our `d2d1.dll` (d2d-ffi) and the in-process test can share the same WIC objects.
name = "windowscodecs"
# `staticlib` for the `libwindowscodecs.a` the .NET browser-wasm (emscripten) relink in paint.rs needs.
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
# `jxr` (default) compiles the JPEG-XR (HD Photo / WMPhoto) encoder and decoder arms. Turning it off
# (`--no-default-features`) drops the JPEG-XR codec: CreateEncoder/CreateDecoder for the JPEG-XR
# container report WINCODEC_ERR_COMPONENTNOTFOUND (the error for a codec that isn't installed), and
# the codec's engine is unreferenced so it links out. Desktop and OpenD2D's own wasm keep the default;
# the plug-in host's wasm build turns it off to shrink the bundle.
default = ["jxr"]
jxr = []

[dependencies]
d2d = { path = "../d2d" }
roxmltree = "0.20.0"
# `windows`/`windows_core` resolve to the shim crates (real crates on Windows, windows-bindgen output
# elsewhere), so the one COM implementation in `win/*` compiles anywhere. See d2d-ffi.
windows = { package = "windows-shim", path = "../windows-shim" }
windows_core = { package = "windows-core-shim", path = "../windows-core-shim" }
