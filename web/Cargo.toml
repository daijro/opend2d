# Phase 4A browser runner. Standalone workspace so it never perturbs the native workspace build
# (it only ever targets wasm32). Reuses the exact conformance driver + embedded corpus from
# crates/d2d/tests/conformance.rs — see src/lib.rs.
[workspace]

[package]
name = "d2d-web"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
d2d = { path = "../crates/d2d" }
d2d-reference = { path = "../harness" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The conformance driver builds effect CLSIDs with it (same pin as crates/d2d dev-dependencies).
windows-core = { version = "=0.62.2", default-features = false }
# Glyph lookups for the text arms (same pin as crates/d2d).
skrifa = { version = "=0.47.0", default-features = false, features = ["std"] }
# Must match the wasm-bindgen CLI (0.2.128); wasm-pack fetches the matching CLI in CI.
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "s"
