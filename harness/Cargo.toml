[package]
name = "d2d-reference"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
png = "0.17.16"
# crt-verify checks the production maths ports against Windows' C runtimes.
crt = { path = "../crates/crt" }

[target.'cfg(windows)'.dependencies]
# windows-core is named directly so the `#[implement]` macro's `::windows_core::` paths resolve.
windows-core = "0.58.0"
windows = { version = "0.58.0", features = [
  "implement",
  "Foundation_Numerics", "Win32_Foundation", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Print capture: a custom IPrintDocumentPackageTarget that writes native's XPS to a file.
  "Win32_Storage_Xps", "Win32_Storage_Xps_Printing", "Win32_Storage_Packaging_Opc",
  "Win32_Security",
] }

[profile.release]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("native-detour"))'] }
